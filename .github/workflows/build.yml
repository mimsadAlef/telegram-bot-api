name: Build Telegram Bot API

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            gperf \
            libssl-dev \
            zlib1g-dev

      - name: Show tool versions
        run: |
          cmake --version
          g++ --version
          gperf --version

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel

      - name: Install
        run: |
          sudo cmake \
            --install build

      - name: Verify binary
        run: |
          ls -lah /usr/local/bin/
          /usr/local/bin/telegram-bot-api --help || true

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          cp /usr/local/bin/telegram-bot-api \
             artifact/

          cp /usr/local/bin/telegram-bot-api-health-check \
             artifact/ 2>/dev/null || true

          tar -czf telegram-bot-api-linux-x86_64.tar.gz \
            -C artifact .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-linux-x86_64
          path: telegram-bot-api-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
